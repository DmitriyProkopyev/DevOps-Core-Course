---
- name: Install prerequisites for HTTPS repos
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Create keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Install Docker via Ubuntu repo
  become: true
  ansible.builtin.apt:
    name:
      - docker.io
      - containerd
    state: present

- name: Ensure Docker service is running and enabled
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add {{ docker_user }} to docker group
  become: true
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Install python3-docker for Ansible modules
  become: true
  ansible.builtin.apt:
    name: python3-docker
    state: present