---
- name: Docker role tasks
  tags: docker
  block:
    - name: Docker installation block
      become: true
      tags: docker_install
      block:
        - name: Install prerequisites for HTTPS repos
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present
            update_cache: true

        - name: Create keyrings directory
          become: true
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Add Docker GPG key
          become: true
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'

        - name: Add Docker repository (modern .sources format)
          become: true
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/docker.sources
            content: |
              Types: deb
              URIs: https://download.docker.com/linux/ubuntu
              Suites: {{ ansible_distribution_release }}
              Components: stable
              Architectures: amd64
              Signed-By: /etc/apt/keyrings/docker.asc

        - name: Update apt cache
          become: true
          ansible.builtin.apt:
            update_cache: true

        - name: Install Docker Engine and Compose v2 plugin
          become: true
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

      rescue:
        - name: Wait before retrying apt-related tasks
          ansible.builtin.pause:
            seconds: 10

        - name: Retry apt update after Docker GPG / repo failure
          ansible.builtin.apt:
            update_cache: true

      always:
        - name: Ensure Docker service is enabled and running (always)
          become: true
          ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true

    - name: Docker configuration block
      become: true
      tags: docker_config
      block:
        - name: Add {{ docker_user }} to docker group
          ansible.builtin.user:
            name: "{{ docker_user }}"
            groups: docker
            append: true

        - name: Install python3-docker for Ansible modules
          ansible.builtin.apt:
            name: python3-docker
            state: present