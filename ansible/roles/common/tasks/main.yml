---
- name: Ensure apt cache is up to date
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  become: true
  ansible.builtin.apt:
    name:
      - python3-pip
      - curl
      - git
      - vim
      - htop
    state: present

- name: Set system timezone
  become: true
  ansible.builtin.timezone:
    name: Europe/Moscow
