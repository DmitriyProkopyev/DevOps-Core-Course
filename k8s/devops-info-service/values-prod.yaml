version:
  major: 1
  minor: 1
  patch: 0
replicas: 3
image:
  repository: controlw/devops-info-service
  tag: latest
resources:
  minimum:
    ram: "128Mi"
    disk: "256Mi"
  maximum:
    ram: "256Mi"
    disk: "512Mi"
service:
  type: LoadBalancer
ports:
  internal: 8000
  external: 30080
  container: 5000
probes:
  liveness:
    endpoint: /health
    period: 25
  readiness:
    endpoint: /health
    period: 30
secret:
  name: credentials
  username: admin
  password: anothersupersecretpassword
persistence:
  enabled: true
  size: 100Mi
  storageClass: standard